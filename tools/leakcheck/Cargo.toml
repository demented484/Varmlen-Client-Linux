[package]
name = "leakcheck"
version = "0.1.0"
edition = "2021"
description = "Varmlen diagnostics: continuously watch public IP and RTT over TCP (HTTP) and UDP (STUN) to verify split tunneling and reconnect safety"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
