[package]
name = "varmlend"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Privileged networking daemon for Varmlen"

[lib]
name = "varmlend"
path = "src/lib.rs"

[[bin]]
name = "varmlend"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
libc = "0.2"
nix = { version = "0.30", features = ["fanotify", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
